# Custom hyprlock - terminal style
$accent = rgba(255, 60, 60, 1.0)
$fg     = rgba(235, 235, 235, 1.0)
$dim    = rgba(235, 235, 235, 0.6)
$font   = JetBrainsMono Nerd Font
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
    no_fade_in = false
    no_fade_out = false
}

animations {
    enabled= true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 8, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldFade, 1, 4, smooth
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldWidth, 1, 4, smooth
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)
    blur_size = 4
    blur_passes = 3
    noise = 0.02
    contrast = 1.1
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 150
    font_family = $font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A // %d.%m.%Y')"
    color = $accent
    font_size = 24
    font_family = $font Bold
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = [ $USER@arch ]
    color = $dim
    font_size = 18
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = $fg
    check_color = rgba(255, 200, 0, 1.0)
    fail_color = rgba(255, 0, 0, 1.0)
    fail_text = <i>access denied</i>
    capslock_color = rgb(255,255,255)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff88">enter password</span></i>
    hide_input = false
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, -160
    halign = center
    valign = center
}

# Battery (bottom right)
label {
    monitor =
    text = cmd[update:5000] echo "$($Scripts/Battery.sh)"
    color = $dim
    font_size = 16
    font_family = $font
    position = -40, 55
    halign = right
    valign = bottom
}

# Uptime (bottom right)
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p)"
    color = $accent
    font_size = 16
    font_family = $font
    position = -40, 20
    halign = right
    valign = bottom
}
